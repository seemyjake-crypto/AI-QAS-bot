<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Answer Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .chat-container { width: 100%; max-width: 700px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; }
        .header { padding: 20px; background: #0070f3; color: white; border-top-left-radius: 12px; border-top-right-radius: 12px; text-align: center; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; }
        .user-message { background: #0070f3; color: white; align-self: flex-end; }
        .bot-message { background: #eef2f5; color: #333; align-self: flex-start; }
        .input-area { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; outline: none; }
        input:focus { border-color: #0070f3; }
        button { background: #0070f3; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0059c1; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>AI Q&A Assistant</h2>
        <p>Ask any question and get instant answers</p>
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">Hello! Ask me anything, and I will help you find an answer.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your question..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Ask</button>
    </div>
</div>

<script>
    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();

        if (!text) return;

        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.innerText = text;
        chatBox.appendChild(userDiv);

        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        const botDiv = document.createElement('div');
        botDiv.className = 'message bot-message';
        botDiv.innerText = 'Thinking...';
        chatBox.appendChild(botDiv);

        try {
            const response = await fetch('/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text })
            });

            const data = await response.json();
            botDiv.innerText = data.answer || "Sorry, I couldn't generate a response.";
        } catch (error) {
            botDiv.innerText = "Error connecting to AI service. Please try again.";
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
